<!--
  标题排版模板 — H2 PART 大标题 + H3 时间线子标题

  【H2 二级标题】PART 编号格式（01 PART | 标题）— 固定格式
  适用：文章骨架大章节分割，如"PART 01 认识 Claude Code"

  【H3 三级标题】时间线格式（绿色编号圆角方块 + 绿色粗体标题 + 浅灰竖线包裹内容）— 固定格式
  适用：PART 内部的子节点，如"① 图形化界面""② 上下文可视化"
  视觉要求：竖线紧贴方块、随内容收尾、浅灰若隐若现、文字与标题齐平（🔴 2026-06-26 圆→方）
  使用方式：用开标签 + 闭标签包裹整个 H3 内容

  变量说明：
  | 变量            | 说明                        | 字数限制        |
  |-----------------|----------------------------|----------------|
  | {{H2_TITLE}}    | 标题文字                    | ≤20 汉字       |
  | {{H2_NUMBER}}   | 序号数字（H2 PART：01,02；H3 时间线：1,2,3） |       |
-->

<!-- ========================================
     【H3 三级标题】时间线格式
     注意：{{H2_CONTENT}} 处替换为该节的全部内容
     ======================================== -->
<section style="margin: 28px 8px 0; border-left: 2px solid rgba(0,0,0,0.06); margin-left: 12px; padding-left: 18px;">
  <!-- 标题行：圆角方块用负 margin 叠在竖线上（2026-06-26 圆→方，与有序列表 H4 圆形对调） -->
  <section style="line-height: 24px; margin-bottom: 8px;">
    <span style="display: inline-block; width: 24px; height: 24px; min-width: 24px; min-height: 24px; background-color: #2F6F8F; border-radius: 6px; text-align: center; line-height: 24px; color: #ffffff; font-size: 13px; font-weight: bold; vertical-align: middle; margin-left: -30px; margin-right: 8px;">{{H2_NUMBER}}</span>
    <span style="font-size: 16px; font-weight: bold; color: #2F6F8F; vertical-align: middle;">{{H2_TITLE}}</span>
  </section>
  <!-- 内容区：border-left 自然延伸覆盖 -->
  {{H2_CONTENT}}
</section>


<!-- ========================================
     【H2 二级标题】PART 编号格式（固定格式）
     ======================================== -->
<section style="margin: 40px 8px 20px; padding: 12px 0; border-bottom: 1px solid rgba(47, 111, 143,0.12); overflow: hidden;">
  <section style="float: left; min-width: 56px; text-align: center; border-right: 2px solid rgba(47, 111, 143,0.3); padding-right: 14px; margin-right: 14px;">
    <section style="font-size: 28px; font-weight: bold; color: #2F6F8F; line-height: 1;">{{H2_NUMBER}}</section>
    <section style="font-size: 11px; color: #2F6F8F; letter-spacing: 2px;">PART</section>
  </section>
  <section style="overflow: hidden;">
    <section style="font-size: 18px; font-weight: bold; color: #333333; line-height: 1.3;">{{H2_TITLE}}</section>
    <section style="font-size: 12px; color: #8a929a; letter-spacing: 1px; margin-top: 4px;">{{H2_SUBTITLE}}</section>
  </section>
</section>
