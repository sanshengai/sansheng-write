<!--
  导读栏 HTML 模板（图框式卡片）

  位置：品牌头图下方紧跟
  设计：纯代码图框卡片（非图片，适配暗黑模式+可被搜索收录）

  规格：
  - 整体：圆角 12px 卡片，微阴影，宽度撑满正文区域
  - 左侧 60%：大字标题（1-2 行钩子文案，黑色和品牌绿各占一行，每行不超过 8 字）
  - 右侧 40%：一张 1:1 正方形插图（调用 baoyu-image-gen 单独生成，不能复用封面图）
  - 灰色副标题：紧跟绿色短横线后
  - 底栏：品牌绿底色，左侧标签文字，右侧 1-2 个胶囊标签
  - 字号 18px，确保手机端不换行

  变量说明：
  | 变量              | 说明                           | 字数限制            |
  |-------------------|-------------------------------|-------------------|
  | {{HERO_LINE1}}    | 标题第一行（黑色）              | ≤8 汉字           |
  | {{HERO_LINE2}}    | 标题第二行（品牌绿）            | ≤8 汉字           |
  | {{HERO_SUBTITLE}} | 副标题描述                      | ≤15 汉字          |
  | {{HERO_IMAGE_URL}}| 右侧插图 URL（微信素材库）       | —                 |
  | {{TAG_1}}         | 底栏胶囊标签 1                  | ≤4 汉字或 8 字母   |
  | {{TAG_2}}         | 底栏胶囊标签 2                  | ≤4 汉字或 8 字母   |

  注意：底栏左侧固定使用白色 Logo 图片（brand/logo-white.png），不使用文字变量。
  排版助手职责：
  1. 读取主笔终稿，提炼钩子文案填入 HERO_LINE1/LINE2
  2. 调用 baoyu-image-gen 生成与文章主题匹配的方形插图（1:1，不复用封面）
  3. 上传到微信素材库获取 URL，填入 HERO_IMAGE_URL
  4. 如某变量不需要，删除该变量所在的整个 <section> 标签，不留空
-->

<section style="margin: 16px auto; border-radius: 12px; overflow: hidden; border: 1px solid #d7e3ea; box-shadow: 0 4px 16px rgba(0,0,0,0.04); background-color: #ffffff;">
  <section style="padding: 20px 16px; display: table; width: 100%; box-sizing: border-box;">
    <section style="display: table-cell; width: 64%; vertical-align: middle; text-align: left !important;">
      <section style="font-size: 18px; font-weight: bold; color: #333333; line-height: 1.4; margin-bottom: 10px; text-align: left !important;">{{HERO_LINE1}}<br><span style="color: #2F6F8F;">{{HERO_LINE2}}</span></section>
      <section style="width: 32px; height: 3px; background-color: #2F6F8F; margin-bottom: 8px; border-radius: 2px;"></section>
      <section style="font-size: 12px; color: #8a929a; letter-spacing: 0.5px; text-align: left !important;">{{HERO_SUBTITLE}}</section>
    </section>
    <section style="display: table-cell; width: 32%; vertical-align: middle; text-align: right;">
      <img src="{{HERO_IMAGE_URL}}" style="width: 78px; height: 78px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: inline-block;">
    </section>
  </section>
  <section style="padding: 10px 16px; background-color: #2F6F8F; display: table; width: 100%; box-sizing: border-box;">
    <section style="display: table-cell; vertical-align: middle; width: 45%; text-align: left; line-height: 0; font-size: 0;">
      <section style="width: 64px; overflow: hidden; display: inline-block; vertical-align: middle; line-height: 0; font-size: 0;"><img src="素材/logo-white.png" data-local-path="素材/logo-white.png" style="width: 64px; height: auto; display: block; opacity: 0.95; margin: 0;"></section>
    </section>
    <section style="display: table-cell; vertical-align: middle; text-align: right; white-space: nowrap;">
      <span style="display: inline-block; padding: 2px 7px; background-color: rgba(255,255,255,0.2); color: #ffffff; font-size: 10px; border-radius: 999px; margin-left: 3px; line-height: 1.5; white-space: nowrap;">{{TAG_1}}</span><span style="display: inline-block; padding: 2px 7px; background-color: rgba(255,255,255,0.2); color: #ffffff; font-size: 10px; border-radius: 999px; margin-left: 3px; line-height: 1.5; white-space: nowrap;">{{TAG_2}}</span>
    </section>
  </section>
</section>
