# article-meta.yaml — 文章个性化配置模板
# 复制到文章工作目录（如 <数据目录>/15-xxx/article-meta.yaml），按实际填写
# format_layout.py 会自动读取此文件，CLI 参数优先于此处的值
#
# 用途：持久化每篇文章的个性化决策，避免中途插入时遗漏配置

# 🔴 人味种子（选题/大纲阶段采集，不可跳过 — 见 outline.md 步骤 1.5）
seed: ""                     # 作者的真实开头 / 亲历细节 / 反常识角度 / 口语原话（四选一即可）。
                             # 原话原样存，不要加工成书面语。正文从这个种子长出来，磨稿不许把它磨成通用表达。
                             # 留空 = 本篇先天缺人味（纯通用生成），照写但心里有数，别假装有味道。

# 基础信息（大纲阶段确定）
title: ""                    # 文章标题
style: ""                    # 主路由风格：填 profile/corpus/authors/ 里某本手册的名字（如 example-author）
modifier_style: ""           # 叠加路由 (可选, 留空或填另一本手册名)
                             # 跟主路由组合使用 -- 在主调性基础上叠加风格修饰 (如小说式开场 / 教程类钩子)
                             # 适合做"局部染色"，别当整篇底色用
logic_bone: ""               # 逻辑骨架：ASC / CSA / QSCA / SCA
genre: ""                    # 文体：深度文 / 教程文

# 作品库归档（archive 阶段写入 works.yaml）
category: ""                 # 分类码 6 选 1：AIT(实测) / TUT(教程) / OBS(观察) / ROB(硬件) / KID(育儿) / ESS(随笔)
                             # archive 时据此自动分配 code（如 AIT-08，分类内独立计数、发布即冻结）
outward_category: ""         # 🆕 对外分类（读者可见）7 选 1。🔴 标题阶段（title.md 第一步）就定，
                             #   直接作外标题的「标签 | 」前缀 + 网站/RSS；此处回填后 archive 复用、不再二次判类：
                             #   tutorial(教程) / news(资讯) / picks(精选) / share(分享) / insight(洞察) / essay(随笔) / industry(行业)
                             # 裁决链（自上而下首个命中即定，保唯一归类）：
                             #   教程(面向新手的系统性教学；工具安利/成果展示不算) > 精选(≥3个横向合集/清单/榜单)
                             #   > 分享(自创成果/亲测好物/珍藏书/站内新功能 --"我做了/我在用/我觉得好")
                             #   > 行业(主体是地产/工程行业本身) > 资讯(刚发布/新品/大事件,无亲测背书)
                             #   > 洞察(对 AI/行业的趋势判断·观点) > 随笔(个人成长/生活·兜底)
                             # 漏填兜底：archive 按 category 给默认（TUT→教程 / ESS·KID→随笔 / ROB→资讯 自动；AIT/OBS 必须手填）
tags: []                     # 多标签（兜跨界/副维度），取自 works_registry.TAG_VOCAB 受控词表
digest: ""                   # 一句话摘要（进 作品库 / articles.md / 导读栏卡片）
series: ""                   # 连载标记（如「小龙虾」），可空

# 🕸 品牌织网决策（大纲阶段步骤 7.5 必答 — 见 outline.md；数据源 profile/brand-net.md + works.yaml 近 10 篇，均为可选）
# 三问都允许答"不织"，但必须写决策理由；正文落笔后 link 里声明的 URL 必须真出现在定稿里。
weave:
  link: ""                   # ① 联动：挂哪篇已发文章的正式微信链接（标题+URL+织入位置）；不联动写"不织:理由"
  base: ""                   # ② 阵地：推哪个自有阵地（阵地名+入口+织入位置）；不推写"不织:理由"
  seed: ""                   # ③ 伏笔：预告什么/许了什么新愿（发布后登进 brand-net.md §四承诺台账）；不埋写"不织:理由"

# 排版参数（排版阶段确定）
# part_subtitles:            # PART 模式各章节副标题（可选）
#   # 🔴 写法规范：每条是 H2 原标题的「核心词」或「补充点题」，≤10 汉字。
#   # 不是复述 H2，而是对 H2 的**精简概括或视角转换**——
#   # 太长会撑破版式，和 H2 一字不差则失去副标题的意义。
#   # 示例 H2："为什么 PC 上的语音输入，十年都差一口气"
#   #  ❌ 错误："为什么 PC 上的语音输入十年都差一口气"（复述原文）
#   #  ✅ 正确："大厂都去做手机端了"（点题核心因素）
#   #
#   # 数量必须与 H2 个数一致（format_layout.py 会前置断言，不对齐直接退出）。
#   #
#   # 不填则走自动拆解：如果 H2 含「：」「——」「—」「 · 」分隔符
#   # （例："第三条战线：把 AI 搬到你桌上"），会自动把左侧（≤10字）作副标题、
#   # 右侧作主标题。拆不出来的 H2 会在日志里提醒补齐。
#   - "产品逻辑"
#   - "行业变局"

# 表格列宽（列宽由大模型按内容测算的固定值提供，更协调）
# 每个内容表一组列宽，按表在文中出现顺序对齐；数字自动归一化到和为 100。
# 不填某表 / 组数列数对不上 → 该表静默回退脚本 sqrt 兜底（偏等宽、不够协调）。
# 两列参考 38/62、35/65、40/60；三列参考 26/46/28（长内容列给足，短表头列别 starve）。
# table_widths:
#   - [38, 62]        # 第 1 个表（两列）
#   - [26, 46, 28]    # 第 2 个表（三列）

# 导读栏参数（排版阶段确定，强烈建议填写）
# 🟢 推荐使用下面的嵌套写法。format_layout.py 也兼容扁平写法（lead_line1: "..." 等）作过渡，
#    但新文章统一用嵌套，视觉层次清晰、IDE 折叠友好。
# lead 同时供两处消费：① 文内导读栏组件 ② 封面 L1/L2 文案（scripts/visual_workflow.py）
# 封面对字数是硬约束——L1 要占画布高 12%~14% 才能成为视觉主体，反推左区只放得下约 8 字位；
# 超限模型只能缩字号，封面规范压不住。详见 references/title.md「封面三件套」。
lead:
  line1: ""                  # 标题第一行 / 封面 L1（≤8 汉字位，黑色；封面上为纯白最大字）
  line2: ""                  # 标题第二行 / 封面 L2（≤12 汉字位；导读栏整行主题色，封面只染 accent）
  accent: ""                 # 🔴 封面 L2 里染主题色的落点词（2~5 字，必须是 line2 的结尾子串）
                             #    不填则由模型自挑收尾短语——能出图但落点会飘，新文章一律显式写
  subtitle: ""               # 副标题（≤15 汉字，灰色）
  tag1: ""                   # 底栏胶囊标签1（≤4 汉字）
  tag2: ""                   # 底栏胶囊标签2（≤4 汉字）

# 维度随机化（写作阶段确定，见 writing.md）
dimensions: []               # 本篇激活的维度组合，如 ["叙事视角: 对话体", "情感基调: 毒舌调侃", "节奏型: 快慢剧烈交替"]
closing_type: ""             # 收尾类型 9 选 1：自然断流 / 未答之问 / 场景回扣 / 硬切 / 反结论 / 画面定格 / hook_question / self_deprecating / expectant_blessing
                             # v5: hook_question 互动钩（"你家有这种情况吗？"，跨篇上限 1/3 篇）
                             # v5: self_deprecating 自轻消解（"读者误我啊"，自嘲收束）
                             # v5: expectant_blessing 期许托付（"希望今天给你一些启发"，上限 1/3 篇）
                             # 详见 anti-ai-filter.md §1.5

# 封面图参数（配图阶段确定）
cover_keywords: ""           # 封面图核心视觉符号关键词
cover_style: "montage-evidence"  # 新文章固定；历史复刻才允许显式使用旧风格。

# 信息图参数（配图阶段确定）
infographic_style: "claymation"      # 固定值，全站统一粘土风。不按题材分流。
                                     # 旧版按 infographic_subject 在 claymation / morandi-journal
                                     # 之间路由，而校验只查两者配不配套、从不查题材判断本身对不对，
                                     # 填错之后整条链自洽、所有闸门放行。这条路由已整体砍掉。
                                     # morandi-journal 配方仍封存在 profile 的 visual.profiles 里。
visual_profile: "warm-light-clay"    # 固定值，与 claymation 绑定。
                                     # 配方会把暖米黄背景、当前主题主色、浅色阈值同时绑定到信息图与 Hero。

# 音乐配置（BGM 阶段确定；引擎 MiniMax，风格池收窄为 4 种舒缓系）
music:
  # 风格 4 选 1（必须跟 generate_article_bgm.py 的 STYLE_POOL 同步）：
  #   ethereal_folk   空灵民谣 — 深度思考/观点输出/人物说理（70 BPM）
  #   ambient_vocal   环境浮声 — 科技探索/未来想象/AI工具对比/前沿趋势（62 BPM）
  #   ambient_piano   氛围钢琴 — 哲思文章/行业反思/年度盘点/收尾感悟（66 BPM）
  #   cinematic_vocal 影视人声 — 长文特稿/行业深度分析/重磅专题/年终总结（72 BPM）
  # 留空 = 由当前执行模型根据文章内容从 4 种舒缓风格池里选（并回避最近几篇用过的）
  style: ""
  gender: ""                 # 人声性别：留空=按文章序号自动交替（奇数女/偶数男），或手动 female / male
  song_name: ""              # 歌曲名（AI 起名或自定义）
  model: "music-2.6-free"    # MiniMax 限免版（付费用 music-2.6）

# 阶段完成记录（各阶段完成后勾选）
# - outline
# - writing
# - title
# - layout
# - publish
