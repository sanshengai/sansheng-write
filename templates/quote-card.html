<!--
  金句卡片模板（左竖条 + 浅底文本框）

  用途：正文里需要把某句大师原话/核心金句单独提出来强调时使用。
  位置：通常放在某个论证段落收束后、或 H2 章节末尾作"小节金句收口"。

  🔴 2026-06-26 · 58 号 拍板定的标准样式（取代旧版"整块主题绿渐变盒"）：
     旧版 `background:linear-gradient(135deg,#2F6F8F,#245a75)` 满绿底 + 白字 + 大号
     装饰引号 `&ldquo;` —— 问题：① 视觉太厚重、跟正文割裂、不够融入；
     ② 装饰引号 `&ldquo;` 在微信里渲染成乱码（"idqu"/方框）。
     新标准 = 左侧主题色竖条 + 右侧极浅绿文本框，轻盈、融入正文、无乱码。

  规格：
  - 左竖条：`border-left:4px solid #2F6F8F` + 右上/右下圆角（与正文 ✗/✓ 框同语言）
  - 底色：`rgba(47, 111, 143,0.05)` 极浅绿（不是满绿）
  - 引文：深色 #26333a，font-weight:700，line-height:1.9，不用白字
  - 出处行（🔴 2026-06-26 · 拍板「方案 A」改样式，更协调）：
      · 上方加一条极淡发丝分隔线 `border-top:1px solid rgba(47, 111, 143,0.14)`（与引文留出层次）
      · 文字降到 12px、改低饱和灰绿 #8a929a（不再用满绿 600，让出处「退后」当脚注、不与引文抢色）
      · 右对齐，letter-spacing:.04em，前缀 `--`（破折号用两个英文连字符）
      · 书名前可用「 · 」分隔人名与书名，如「-- 查理·芒格 ·《穷查理宝典》」
  - 🔴 禁止 `&ldquo;` / `&rdquo;` / `&lsquo;` 等装饰性 HTML 实体（微信乱码）；
    引号要么用中文「」/""（写在文字里），要么不加装饰引号
  - 单篇加粗口号式金句 ≤2（与 craft-techniques.md §金句节拍器禁令一致）

  变量：{{QUOTE}} = 金句正文； {{ATTRIBUTION}} = 出处（如「-- 查理·芒格 ·《穷查理宝典》」）
-->
<section style="margin:24px 8px;border-left:4px solid #2F6F8F;background:rgba(47, 111, 143,0.05);border-radius:0 10px 10px 0;padding:15px 18px;">
<section style="font-size:16px;font-weight:700;line-height:1.9;letter-spacing:.02em;color:#26333a;">{{QUOTE}}</section>
<section style="margin-top:12px;padding-top:9px;border-top:1px solid rgba(47, 111, 143,0.14);text-align:right;font-size:12px;color:#8a929a;letter-spacing:.04em;">{{ATTRIBUTION}}</section>
</section>
