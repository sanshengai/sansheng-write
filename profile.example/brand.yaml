# ============================================================================
#  品牌 profile -- 中性示例值。复制整个 profile.example/ 改成你自己的，
#  然后 export SANSHENG_WRITE_PROFILE_DIR=/path/to/your/profile
#
#  这里放「私有但非密」的东西：配色、署名、身份卡、语料指针。
#  API key 不放这里 —— 那是 .env 的事（见 .env.example）。
# ============================================================================

# 站点/专栏名。出现在排版产出的页脚、封面署名、发布命令的 --author。
name: "Your Column"
author: "Your Name"
tagline: "一个用 AI 写作的人"

# 主题：留空用下面的 colors；填 themes/ 下的文件名可整套换皮
# 内置：slate（默认，钢青）/ ink（近墨黑）/ sage（草木绿）/ jade（青玉绿）/ amber（琥珀赭）/ plum（梅子紫）
theme: ""

# ============================================================================
#  设计令牌（Design Tokens）-- 排版引擎渲染期会把默认值替换成这里的值
#  改一处，全局生效：HTML 组件模板、format_layout.py、发布命令 --color 统一读它
# ============================================================================
colors:
  primary: "#2F6F8F"            # 一级强调：H3 / 表头 / 重点文字 / 一级标识
  secondary: "#7FB0C4"          # 二级强调：次级标识 / 辅助强调（同色系偏浅）
  primary_deep: "#245a75"       # 主色深一档（渐变用）
  primary_soft: "rgba(47, 111, 143,0.05)"   # 强调卡底（极弱通透层）
  row_tint: "rgba(47, 111, 143,0.03)"       # 表格交替行（最淡）
  surface_soft: "#f2f7f9"       # 容器模块底（深读 / 链接 / 音乐卡）
  surface_inset: "#eaf1f5"      # 内嵌 URL / 图标框
  surface: "#eef0f2"            # 内分隔线 / 表格行分隔
  border_card: "#d7e3ea"        # 卡片 / 模块外框
  text_strong: "#333333"        # 正文
  text_title: "#26333a"         # 深色标题 / 引文
  text_mute: "#8a929a"          # 副标题 / 说明 / 出处
  text_link: "#4a6b7a"          # URL 文字

# ============================================================================
#  视觉配方 -- 生图 Prompt 与最终图片的机器合同
#  accent: brand-primary 会在运行时解析为当前主题 colors.primary。
#  调整这些值会改变 visual_profile_sha256，旧 prompt 将被明确判为配方漂移。
# ============================================================================
visual:
  default_profile: "warm-light-clay"
  profiles:
    montage-evidence:
      style: "montage-evidence"
      background: "#0E0E10"
      accent: "brand-primary"
      neutrals: ["#FFFFFF", "#141416", "#161618", "#1A1A1A", "#1F1F25"]
      layout: "left-50-gap-6-right-44"
      material: "flat-vector editorial object with thin physical depth and same-hue halftone"
      lighting: "one upper-left 45-degree key light; all soft shadows fall lower-right"
      required_visual_traits:
        - "unified deep-charcoal canvas"
        - "left text area and right evidence collage"
        - "purely pictorial low-contrast background with no ghost words or watermark text"
        - "one dominant metaphor object with two or three smaller evidence badges"
        - "quiet low-contrast pill for article tags"
      forbidden_visual_traits:
        - "bright or photographic collage"
        - "people, faces or hands"
        - "centered or bottom-aligned poster title"
        - "hard split-color panels"
        - "neon, chrome, glassmorphism or glossy reflections"
        - "brand text, account name, issue number or signature"

    warm-light-clay:
      style: "claymation"
      background: "#F5F0E6"
      accent: "brand-primary"
      neutrals: ["#FBF8F2", "#D8D2C7", "#5A554F"]
      material: "matte soft clay, no metallic or photorealistic surface"
      lighting: "bright diffuse studio light, low contrast, soft shadows"
      required_prompt_groups:
        - ["warm beige", "warm ivory", "暖米黄"]
        - ["light palette", "bright palette", "浅色调", "明亮"]
        - ["matte clay", "soft clay", "哑光黏土", "软黏土"]
        - ["diffuse light", "soft lighting", "柔和漫射", "低对比"]
      forbidden_prompt_terms:
        - "charcoal background"
        - "dark background"
        - "black background"
        - "navy"
        - "steel blue"
        - "brick red"
        - "mustard yellow"
        - "metallic"
        - "chrome"
        - "neon"
        - "high contrast"
        - "deep background"
      thresholds:
        mean_luma_min: 178
        dark_pixel_luma: 80
        dark_pixel_ratio_max: 0.18
        mean_saturation_max: 0.30

    morandi-journal:
      style: "morandi-journal"
      background: "#F5F0E6"
      accent: "#7BA3A8"
      neutrals: ["#D4956A", "#4A4540", "#F5E6C8"]
      material: "hand-drawn doodle with organic imperfect ink lines and subtle warm paper texture"
      lighting: "flat editorial light; warm and cozy, never photographic"
      required_prompt_groups:
        - ["hand-drawn doodle", "手绘 doodle"]
        - ["warm Morandi", "莫兰迪柔色"]
        - ["washi tape", "和纸胶带"]
        - ["bullet journal", "手账"]
      forbidden_prompt_terms:
        - "photorealistic"
        - "stock illustration"
        - "strict grid"
        - "pure white background"
        - "flat vector icons"
        - "corporate"
      required_visual_traits:
        - "hand-drawn doodle illustrations with organic imperfect ink lines"
        - "warm cream background with muted sage, terracotta and pale-yellow accents"
        - "washi tape, dotted frames, curved arrows and rounded note cards"
        - "clear handwritten-style hierarchy with highly legible Chinese"
        - "clean-sketch bullet-journal variant with restrained decoration"
      forbidden_visual_traits:
        - "photographic or stock-image collage"
        - "aged parchment, torn-paper scrapbook or watercolor scene panels"
        - "flat vector icon system or rigid corporate grid"
        - "pure white background"
        - "digital dashboard, neon or metallic surface"
      thresholds:
        mean_luma_min: 178
        dark_pixel_luma: 80
        dark_pixel_ratio_max: 0.12
        mean_saturation_max: 0.32

radius:
  sm: "6px"                 # 序号块 / 图标底 / URL 框
  media: "8px"              # 图片 / 缩略图
  card: "10px"              # 卡片 / 表格 / 链接卡
  module: "12px"            # 大模块（导读 / 深读）
  pill: "999px"             # 胶囊（标签 / 徽章）

# ============================================================================
#  身份卡 -- 排版产出的「关注卡片」需要。
#  🔴 下面全是明显假值，发布前**必须**改成你自己的，否则页脚会渲染出占位内容。
#  biz_id / headimg 的取法：打开你公众号**任一篇已发文章**的网页版，地址栏或页面源码里
#  复制 __biz= 后面的值（含 = padding）即 biz_id；源码搜 headimg 即头像 URL。
#  （后台「账号详情」页并不直接展示这两个值。）
# ============================================================================
identity:
  platform: "wechat"                    # wechat | none
  nickname: "YOUR_ACCOUNT_NAME"         # 必须改
  logo_text_allowlist: []               # 官方 Logo 自带的固定英文/缩写，逐项白名单
  alias: "YOUR_ACCOUNT_ALIAS"           # 必须改
  biz_id: "REPLACE_WITH_YOUR_BIZ_ID"    # 必须改（公众号 biz，base64）
  headimg: ""                           # 必须改（头像 URL；留空则不渲染头像）
  signature: "一句话简介"                 # 必须改
  site: "https://example.com"

# ============================================================================
#  写作偏好
# ============================================================================
writing:
  # 风格路由：指向 corpus/authors/<name>.compact.md
  # 公开仓只带一套虚构示例（example-author）。要长出你的风格，请自建手册，
  # 方法见 corpus/authors/README.md（教你怎么从喜欢的作者作品逆向出手册）。
  default_style: "example-author"
  # 无自备语料时，注入仓内原创的「人味示例集」做基础去 AI 味兜底
  fallback_voice_samples: true
  # 单篇加粗口号式金句上限
  max_bold_slogans: 2
  # 日更类文章的标题前缀：命中的不进「推荐阅读」卡片池（日报会淹没推荐位）
  # 留空 [] 则不过滤
  daily_title_prefixes: []
  # 发布后·朋友圈文案的固定引流尾巴（见 references/publish.md「发布后·朋友圈文案」节）。
  # 写你自己的官网 + 一句价值 CTA，把读者引去自有阵地；留空则朋友圈文案不带固定尾巴。
  # 官网地址在上面 identity.site；这里写「把读者引过去」的那句话。
  moments_cta: ""

# ============================================================================
#  发布默认（可选）
#  「阅读原文」= 微信 draft/add 的 content_source_url（点「阅读原文」后跳转的 URL）。
#  发布时 references/publish.md 据此解析 baoyu-post-to-wechat 的 --source-url。
#  单篇要覆盖：在该文 article-meta.yaml 写 source_url: <url|treasure|default>。
#  两个都留空则不设「阅读原文」（保持微信默认）。
# ============================================================================
publish:
  source_url_default: "https://example.com"     # 「阅读原文」默认指向（一般填你官网首页）
  source_url_treasure: ""                        # 工具 / 仓库 / 资源类文章的专属去向（可留空）
  # 可选：finalize 在归档验证通过后自动执行。支持 {code}/{article_dir}/{wechat_url}。
  website_command: ""
  # 相对路径命令的工作目录；也可用 SANSHENG_WRITE_WEBSITE_CWD 覆盖。
  website_cwd: ""

# 人工检查点闸门（可选）：想在关键节点停下来人工确认、防前期出错导致全链返工，就打开这里。
#   blueprint = 大纲 + 5 标题候选排序 + 开头候选一包交付后硬停等拍板（开头盲选并入此闸）
#   draft     = 定稿（磨稿 + 双外审修复后）硬停等审读；之后配图→BGM→排版→草稿箱仍全自动
# 未配置 = 全自动（唯一停顿 = 开头盲选）。启用后 pipeline.py verify outline/writing 会硬查
# _blueprint-approval.md / _draft-approval.md 锚点（作者拍板记录，防跨会话静默跳闸）。
# workflow:
#   checkpoints: [blueprint, draft]

# ============================================================================
